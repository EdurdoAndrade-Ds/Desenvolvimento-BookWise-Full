spring:
  application:
    name: bookwise-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:${SERVER_PORT:8080}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Parametros de negocio configuraveis (ver com.bookwise.config.BusinessProperties).
# Valores abaixo sao os padroes; ajuste conforme a politica da biblioteca.
bookwise:
  loan:
    default-days: 14            # prazo padrao do emprestimo quando nao informado
    max-active-per-user: 5      # emprestimos em aberto por usuario (0 = sem limite)
    max-items-per-loan: 5       # itens por emprestimo (0 = sem limite)
    block-when-fine-pending: true  # bloqueia emprestimo/renovacao com multa pendente
    max-renewals: 2             # renovacoes por emprestimo (0 = desabilitado)
    renewal-days: 7             # dias acrescentados por renovacao
  fine:
    per-day: 2.00               # multa por dia de atraso (R$)
  reservation:
    default-expiration-days: 7  # validade padrao da reserva quando nao informada
    hold-stock: true            # reserva bloqueia uma unidade do estoque fisico
  jobs:
    enabled: true               # rotinas periodicas de manutencao
    reservation-expiration-cron: "0 5 0 * * *"
    overdue-fine-cron: "0 10 0 * * *"
