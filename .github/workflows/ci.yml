name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: java, javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v2
      - name: Run CodeQL
        uses: github/codeql-action/analyze@v2

  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    needs: codeql
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Build and test (backend)
        working-directory: backend
        run: mvn -B verify
      - name: Dependency-check (OWASP)
        run: mvn org.owasp:dependency-check-maven:check -Dformat=XML || true
      - name: SpotBugs (static analysis)
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:spotbugs || true

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint / Typecheck
        working-directory: frontend
        run: npm run lint --if-present
      - name: Build frontend
        working-directory: frontend
        run: npm run build --if-present

  openapi-validate:
    name: OpenAPI validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install swagger-cli
        run: npm install -g @apidevtools/swagger-cli
      - name: Validate OpenAPI contract
        run: swagger-cli validate contracts/openapi.yaml

  docker-scan:
    name: Docker build and scan
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t bookwise:ci .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.11.0
        with:
          image-ref: bookwise:ci
