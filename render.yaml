services:
  - type: web
    name: bookwise
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      # Origem do site estatico, ex.: https://bookwise-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        fromDatabase:
          name: bookwise-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bookwise-db
          property: password

  - type: web
    name: bookwise-web
    runtime: static
    rootDir: frontend
    # --include=dev garante tsc/vite/@types mesmo com NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      # Origem do servico do backend, ex.: https://bookwise.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA: /adm, /books/1 etc. sao resolvidos pelo React Router.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: bookwise-db
    plan: free
    databaseName: bookwise
    user: bookwise
